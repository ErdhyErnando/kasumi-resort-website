# CI — lint + format check + typecheck + build (issue #28).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome (ts/js/json/css) + Prettier (.astro only)
      - run: pnpm lint

      - run: pnpm check

      - run: pnpm build
